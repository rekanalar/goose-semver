name: Set the description and the topics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metadata.yml"

permissions:
  contents: write

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Set the description and the topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          {
            echo "### The metadata of ${REPO}"
            echo
            echo 'The description:'
            gh api -X PATCH "repos/${REPO}" \
              -f "description=Semantic versions for the Goose programming language" \
              --jq '.description' 2>&1 | sed 's/^/> /'
            echo
            echo 'The topics:'
            gh api -X PUT "repos/${REPO}/topics" \
              -f "names=goose,goose-lang,semver,versioning" \
              --jq '.names | join(", ")' 2>&1 | sed 's/^/> /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
