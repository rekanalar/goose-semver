name: Set the description and the topics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metadata.yml"

permissions:
  contents: write
  administration: write

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Set the description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          out=$(gh api -X PATCH "repos/${{ github.repository }}" \
            -f "description=Semantic versions for the Goose programming language" \
            --jq '.description' 2>&1)
          rc=$?
          echo "::error title=The description did not go::${out}"
          exit $rc

      - name: Set the topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          out=$(gh api -X PUT "repos/${{ github.repository }}/topics" \
            -f "names=goose,goose-lang,semver,versioning" \
            --jq '.names | join(", ")' 2>&1)
          rc=$?
          echo "::error title=The topics did not go::${out}"
          exit $rc
