name: Set the description and the topics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metadata.yml"

permissions:
  contents: write

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set the description and the topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/report.txt"
          {
            echo "The description:"
            gh api -X PATCH "repos/${REPO}" \
              -f "description=Semantic versions for the Goose programming language" \
              --jq '.description' 2>&1 || true
            echo
            echo "The topics:"
            gh api -X PUT "repos/${REPO}/topics" \
              -f "names=goose,goose-lang,semver,versioning" \
              --jq '.names | join(", ")' 2>&1 || true
            echo
            echo "A fork of the index:"
            gh api -X POST repos/safdafang/goose-index/forks --jq '.full_name' 2>&1 || true
          } > "${report}" 2>&1
          cat "${report}"
      - name: Record the result
        if: always()
        run: |
          set -uo pipefail
          git config user.name "Jim Geovedi"
          git config user.email "jim@geovedi.com"
          git checkout -B logs
          mkdir -p .logs
          cp "$RUNNER_TEMP/report.txt" .logs/metadata.txt
          git add .logs/metadata.txt
          git commit -m "chore: record the result of the metadata run" || true
          git push -f origin HEAD:logs
